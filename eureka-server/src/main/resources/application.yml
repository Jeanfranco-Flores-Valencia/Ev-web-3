server:
  port: 8761

spring:
  application:
    name: eureka-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

eureka:
  instance:
    hostname: localhost
  client:
    # El servidor no se registra a si mismo ni descarga el registro
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/

---
spring:
  config:
    activate:
      on-profile: dev
eureka:
  server:
    # En desarrollo se desactiva el modo de autopreservacion para limpiar rapido instancias caidas
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000
logging:
  level:
    com.netflix.eureka: INFO

---
spring:
  config:
    activate:
      on-profile: test
eureka:
  server:
    enable-self-preservation: false

---
spring:
  config:
    activate:
      on-profile: prod
eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
  server:
    enable-self-preservation: true
logging:
  level:
    root: WARN
